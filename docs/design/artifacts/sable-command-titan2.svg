<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Sable Command / Search Titan 2 visual target</title>
  <desc id="desc">Keyboard-first global Command and Search visual reference for Titan 2 square display and physical keyboard profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07131d"/><stop offset="1" stop-color="#0b2438"/></linearGradient>
    <linearGradient id="screen" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#071019"/><stop offset="1" stop-color="#101e2b"/></linearGradient>
    <style><![CDATA[
      .title{font-family:Inter,Arial,sans-serif;font-size:42px;font-weight:800;fill:#f4f9ff}.subtitle{font-family:Inter,Arial,sans-serif;font-size:20px;fill:#c7d7e8}.panel{fill:rgba(255,255,255,.05);stroke:rgba(255,255,255,.16);stroke-width:1}.label{font-family:Inter,Arial,sans-serif;font-size:18px;font-weight:700;fill:#f4f9ff}.small{font-family:Inter,Arial,sans-serif;font-size:13px;fill:#c7d7e8}.tiny{font-family:Inter,Arial,sans-serif;font-size:11px;fill:#a8bbcc}.phoneText{font-family:Inter,Arial,sans-serif;font-size:13px;fill:#edf5ff}.phoneSub{font-family:Inter,Arial,sans-serif;font-size:10.5px;fill:#b7c7d8}.phone{fill:#05070a;stroke:#222a33;stroke-width:7}.bezel{fill:#11151b;stroke:#384450;stroke-width:2}.screen{fill:url(#screen);stroke:#2a3b4f;stroke-width:1.5}.search{fill:#1c2b3a;stroke:#33485c;stroke-width:1}.row{fill:rgba(255,255,255,.035);stroke:rgba(255,255,255,.075);stroke-width:1}.focus{fill:rgba(38,129,226,.30);stroke:#4eb0ff;stroke-width:2.3}.chip{fill:#112637;stroke:#2e4a62;stroke-width:1}.chipOn{fill:#0875d1;stroke:#65c1ff;stroke-width:1}.blue{fill:#1687ff}.green{fill:#21c063}.orange{fill:#f6a524}.purple{fill:#7964ff}.red{fill:#ff5168}.gray{fill:#6d7d8f}.yellow{fill:#ffd05a}
    ]]></style>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <text x="34" y="54" class="title">Sable Command / Search — Keyboard-First UX</text>
  <text x="36" y="88" class="subtitle">Global command model for Titan 2: apps, settings, Hub, contacts and safe actions from one keyboard-first surface.</text>

  <g transform="translate(28 116)">
    <rect class="panel" x="0" y="0" width="320" height="630" rx="18"/>
    <text x="18" y="32" class="label">1. Global Command</text>
    <g transform="translate(52 58)">
      <rect class="phone" x="0" y="0" width="218" height="520" rx="24"/>
      <rect class="bezel" x="11" y="11" width="196" height="498" rx="15"/>
      <rect class="screen" x="19" y="24" width="180" height="360" rx="8"/>
      <text x="30" y="46" class="tiny">10:46</text><text x="156" y="46" class="tiny">5G 99%</text>
      <rect class="search" x="30" y="61" width="158" height="35" rx="10"/>
      <text x="43" y="83" class="phoneSub">⌕  set</text><text x="174" y="83" class="phoneSub">×</text>
      <text x="30" y="116" class="tiny">Best match</text>
      <rect class="focus" x="27" y="126" width="164" height="42" rx="8"/>
      <circle class="blue" cx="47" cy="147" r="12"/><text x="66" y="143" class="phoneText" style="font-weight:700">Settings</text><text x="66" y="157" class="phoneSub">Open Settings</text>
      <text x="30" y="190" class="tiny">Apps</text>
      <rect class="row" x="30" y="200" width="158" height="35" rx="6"/><circle class="green" cx="47" cy="218" r="11"/><text x="65" y="216" class="phoneText">Sable Start</text><text x="65" y="228" class="phoneSub">Launcher</text>
      <rect class="row" x="30" y="239" width="158" height="35" rx="6"/><circle class="orange" cx="47" cy="257" r="11"/><text x="65" y="255" class="phoneText">Set Alarm</text><text x="65" y="267" class="phoneSub">Clock action</text>
      <text x="30" y="296" class="tiny">Shortcut: / or Fn+3</text>
      <text x="30" y="318" class="tiny">Enter opens · Menu actions</text>
    </g>
    <text x="18" y="605" class="small">One search field, grouped results, local-first ranking.</text>
  </g>

  <g transform="translate(374 116)">
    <rect class="panel" x="0" y="0" width="320" height="630" rx="18"/>
    <text x="18" y="32" class="label">2. Result Groups</text>
    <g transform="translate(52 58)">
      <rect class="phone" x="0" y="0" width="218" height="520" rx="24"/>
      <rect class="bezel" x="11" y="11" width="196" height="498" rx="15"/>
      <rect class="screen" x="19" y="24" width="180" height="360" rx="8"/>
      <text x="30" y="46" class="tiny">10:46</text><text x="156" y="46" class="tiny">5G 99%</text>
      <rect class="search" x="30" y="61" width="158" height="35" rx="10"/><text x="43" y="83" class="phoneSub">⌕  alex</text>
      <g transform="translate(30 109)">
        <rect class="chipOn" x="0" y="0" width="44" height="24" rx="7"/><text x="11" y="16" class="tiny" fill="#fff">All</text>
        <rect class="chip" x="50" y="0" width="49" height="24" rx="7"/><text x="59" y="16" class="tiny">Apps</text>
        <rect class="chip" x="105" y="0" width="53" height="24" rx="7"/><text x="113" y="16" class="tiny">People</text>
      </g>
      <rect class="focus" x="27" y="147" width="164" height="42" rx="8"/><circle class="purple" cx="47" cy="168" r="12"/><text x="66" y="164" class="phoneText" style="font-weight:700">Alex Chen</text><text x="66" y="178" class="phoneSub">Call · Message · Mail</text>
      <rect class="row" x="30" y="197" width="158" height="38" rx="6"/><circle class="blue" cx="47" cy="216" r="11"/><text x="65" y="213" class="phoneText">Messages</text><text x="65" y="226" class="phoneSub">2 matching threads</text>
      <rect class="row" x="30" y="243" width="158" height="38" rx="6"/><circle class="orange" cx="47" cy="262" r="11"/><text x="65" y="259" class="phoneText">Calendar</text><text x="65" y="272" class="phoneSub">Team Sync with Alex</text>
      <rect class="row" x="30" y="289" width="158" height="38" rx="6"/><circle class="gray" cx="47" cy="308" r="11"/><text x="65" y="305" class="phoneText">Contact details</text><text x="65" y="318" class="phoneSub">Open Contacts</text>
    </g>
    <text x="18" y="605" class="small">Groups are visible, but ↑/↓ still move through one result list.</text>
  </g>

  <g transform="translate(720 116)">
    <rect class="panel" x="0" y="0" width="320" height="630" rx="18"/>
    <text x="18" y="32" class="label">3. Provider-safe Actions</text>
    <g transform="translate(52 58)">
      <rect class="phone" x="0" y="0" width="218" height="520" rx="24"/>
      <rect class="bezel" x="11" y="11" width="196" height="498" rx="15"/>
      <rect class="screen" x="19" y="24" width="180" height="360" rx="8"/>
      <text x="30" y="46" class="tiny">10:46</text><text x="156" y="46" class="tiny">5G 99%</text>
      <text x="30" y="78" class="phoneText" style="font-weight:700">Alex Chen</text>
      <text x="30" y="96" class="phoneSub">Messages thread</text>
      <rect class="focus" x="28" y="116" width="160" height="38" rx="8"/><text x="47" y="139" class="phoneText">↵ Open thread</text>
      <rect class="row" x="30" y="162" width="158" height="34" rx="6"/><text x="47" y="183" class="phoneText">↩ Reply</text>
      <rect class="row" x="30" y="202" width="158" height="34" rx="6"/><text x="47" y="223" class="phoneText">★ Add priority</text>
      <rect class="row" x="30" y="242" width="158" height="34" rx="6"/><text x="47" y="263" class="phoneText">ⓘ Source details</text>
      <rect class="row" x="30" y="282" width="158" height="34" rx="6"/><text x="47" y="303" class="phoneText">⚠ Delete…</text>
      <text x="30" y="340" class="tiny">Destructive actions require confirmation.</text>
    </g>
    <text x="18" y="605" class="small">Actions appear only when the source/provider supports them.</text>
  </g>

  <g transform="translate(1066 116)">
    <rect class="panel" x="0" y="0" width="306" height="630" rx="18"/>
    <text x="18" y="32" class="label">4. Locked / Private</text>
    <g transform="translate(44 58)">
      <rect class="phone" x="0" y="0" width="218" height="520" rx="24"/>
      <rect class="bezel" x="11" y="11" width="196" height="498" rx="15"/>
      <rect class="screen" x="19" y="24" width="180" height="360" rx="8"/>
      <text x="30" y="46" class="tiny">10:46</text><text x="156" y="46" class="tiny">5G 99%</text>
      <rect class="search" x="30" y="61" width="158" height="35" rx="10"/><text x="43" y="83" class="phoneSub">⌕  messages</text>
      <circle class="blue" cx="109" cy="138" r="34" opacity=".35"/><text x="98" y="148" class="label">🔒</text>
      <text x="62" y="195" class="phoneText" style="font-weight:700">Content hidden</text>
      <text x="45" y="217" class="phoneSub">Unlock to show message, mail</text>
      <text x="66" y="232" class="phoneSub">and call contents.</text>
      <rect class="focus" x="47" y="262" width="124" height="38" rx="8"/><text x="80" y="286" class="phoneText">Unlock</text>
      <text x="38" y="334" class="tiny">Locked mode shows counts only.</text>
    </g>
    <text x="18" y="605" class="small">Command respects Hub/notification privacy states.</text>
  </g>

  <g transform="translate(28 770)">
    <rect class="panel" x="0" y="0" width="430" height="96" rx="14"/>
    <text x="18" y="28" class="label">Keyboard</text>
    <text x="18" y="54" class="small">/ or Fn+3 opens · type query · ↑↓ focus · ←→ groups · Enter open/run · Menu actions · Back close</text>
    <text x="18" y="78" class="small">Alt/Sym/Fn enter characters in the query field.</text>
  </g>
  <g transform="translate(486 770)">
    <rect class="panel" x="0" y="0" width="430" height="96" rx="14"/>
    <text x="18" y="28" class="label">Mouse / pointer</text>
    <text x="18" y="54" class="small">Hover does not steal focus · click opens · right click/long press shows actions · scroll moves result list.</text>
    <text x="18" y="78" class="small">Keyboard resumes from the last focused row.</text>
  </g>
  <g transform="translate(944 770)">
    <rect class="panel" x="0" y="0" width="428" height="96" rx="14"/>
    <text x="18" y="28" class="label">Validation</text>
    <text x="18" y="54" class="small">Titan 2 hardware template · square display over physical keyboard · no slab-phone or stretched-screen target.</text>
    <text x="18" y="78" class="small">Provider-safe actions only; local results first.</text>
  </g>
</svg>
