    <rect x="0" y="0" width="760" height="890" rx="44" class="phone"/>
    <rect x="45" y="45" width="670" height="670" rx="18" class="screen"/>
    <rect x="45" y="45" width="670" height="54" class="pane"/>
    <text x="70" y="81" class="label med">12:00</text><text x="255" y="81" class="label med">Today · 3 upcoming</text><text x="610" y="81" class="muted small">87%</text>
    <rect x="65" y="119" width="300" height="510" class="pane"/>
    <rect x="383" y="119" width="312" height="510" class="pane"/>
    <text x="84" y="153" class="muted small">UPCOMING</text>
    <rect x="84" y="176" width="250" height="82" rx="8" class="chip"/><rect x="84" y="176" width="250" height="82" rx="8" class="focus"/>
    <text x="101" y="206" class="label med">10:00 Kernel Sync</text><text x="101" y="234" class="muted small">Room B / Jitsi</text>
    <rect x="84" y="274" width="250" height="82" rx="8" class="chip"/><text x="101" y="305" class="label med">13:00 Build Review</text><text x="101" y="333" class="muted small">CI / release blockers</text>
    <rect x="84" y="372" width="250" height="82" rx="8" class="chip"/><text x="101" y="403" class="label med">15:00 Architecture</text><text x="101" y="431" class="muted small">SableOS / Titan 2</text>
    <text x="402" y="153" class="muted small">DETAIL</text>
    <text x="402" y="200" class="label big">Kernel &amp;</text><text x="402" y="238" class="label big">Keymap Sync</text>
    <text x="402" y="284" class="muted small">Mon 10:00-11:30</text><text x="402" y="318" class="muted small">Room B / Jitsi</text><text x="402" y="352" class="muted small">3 attendees · accepted</text>
    <rect x="402" y="410" width="100" height="36" rx="12" class="chip"/><text x="428" y="436" class="label small">Edit</text>
    <rect x="512" y="410" width="90" height="36" rx="12" class="chip"/><text x="535" y="436" class="label small">RSVP</text>
    <rect x="402" y="456" width="90" height="36" rx="12" class="chip"/><text x="424" y="482" class="label small">Mute</text>
    <rect x="502" y="456" width="90" height="36" rx="12" class="chip"/><text x="526" y="482" class="label small">Delete</text>
    <rect x="65" y="649" width="630" height="46" rx="14" class="dock"/>
    <text x="84" y="680" class="label med">&gt; cal search / command...</text>
    <g transform="translate(80 735)">
      <rect x="0" y="0" width="600" height="110" rx="18" class="kbd"/>
      <text x="30" y="37" class="muted tiny">Agenda is the no-scroll-cost fallback for dense days</text>
      <g transform="translate(35 58)"><rect class="key" width="42" height="32" rx="5"/><text x="13" y="22" class="label keytxt">J</text></g>
      <g transform="translate(90 58)"><rect class="key" width="42" height="32" rx="5"/><text x="13" y="22" class="label keytxt">K</text></g>
      <g transform="translate(145 58)"><rect class="key" width="42" height="32" rx="5"/><text x="13" y="22" class="label keytxt">T</text></g>
      <g transform="translate(200 58)"><rect class="key" width="42" height="32" rx="5"/><text x="13" y="22" class="label keytxt">R</text></g>
    </g>
  </g>

  <text x="90" y="2135" class="muted med">Acceptance: latest/current state visible by default · history uses explicit page/search/jump modes · no touchpad-style scrolling requirement.</text>
</svg>
