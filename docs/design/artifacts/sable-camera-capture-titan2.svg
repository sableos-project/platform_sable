<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1700" viewBox="0 0 2200 1700" role="img" aria-labelledby="title desc">
  <title id="title">Sable Camera / Capture UX for Titan 2</title>
  <desc id="desc">Four Titan 2 visual states for camera still viewfinder, pro RAW and high-resolution mode, video stabilization mode, and capture review compare.</desc>
  <defs>
    <style>
      .bg { fill: #05070a; }
      .device { fill: #10141b; stroke: #475569; stroke-width: 4; }
      .screen { fill: #080b10; stroke: #94a3b8; stroke-width: 3; }
      .kbd { fill: #0b0f16; stroke: #334155; stroke-width: 2; }
      .key { fill: #141a23; stroke: #475569; stroke-width: 1; rx: 8; }
      .txt { fill: #e5edf7; font-family: Inter, Arial, sans-serif; }
      .muted { fill: #94a3b8; font-family: Inter, Arial, sans-serif; }
      .accent { fill: #6ee7f9; font-family: Inter, Arial, sans-serif; }
      .warn { fill: #fbbf24; font-family: Inter, Arial, sans-serif; }
      .ok { fill: #86efac; font-family: Inter, Arial, sans-serif; }
      .line { stroke: #334155; stroke-width: 2; }
      .focus { fill: none; stroke: #6ee7f9; stroke-width: 5; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 2; rx: 18; }
      .chip { fill: #1f2937; stroke: #475569; stroke-width: 1; rx: 14; }
      .shutter { fill: none; stroke: #e5edf7; stroke-width: 8; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="2200" height="1700"/>
  <text class="txt" x="80" y="80" font-size="46" font-weight="700">Sable Camera / Capture UX — Titan 2 quality-first contract</text>
  <text class="muted" x="80" y="125" font-size="24">Capability-driven camera design: public high-res/RAW baseline, GCam learnings as reference, privileged logical/tele backend when proven.</text>

  <!-- reusable device 1 -->
  <g transform="translate(80,170)">
    <text class="txt" x="0" y="0" font-size="30" font-weight="700">1 · Still viewfinder</text>
    <rect class="device" x="0" y="30" width="470" height="640" rx="48"/>
    <rect class="screen" x="35" y="60" width="400" height="400" rx="24"/>
    <rect x="55" y="80" width="360" height="360" rx="18" fill="#0b1220"/>
    <circle cx="235" cy="260" r="120" fill="#152238"/>
    <circle cx="235" cy="260" r="86" fill="#21324f"/>
    <rect class="focus" x="145" y="170" width="180" height="180" rx="12"/>
    <text class="txt" x="58" y="102" font-size="18">12:00</text>
    <text class="accent" x="176" y="102" font-size="18" font-weight="700">PHOTO · AUTO</text>
    <text class="muted" x="342" y="102" font-size="18">87%</text>
    <rect class="chip" x="62" y="405" width="82" height="30"/>
    <text class="txt" x="75" y="426" font-size="18">1×</text>
    <rect class="chip" x="154" y="405" width="92" height="30"/>
    <text class="txt" x="168" y="426" font-size="18">HDR</text>
    <rect class="chip" x="256" y="405" width="132" height="30"/>
    <text class="txt" x="270" y="426" font-size="18">Latest visible</text>
    <rect class="panel" x="35" y="475" width="400" height="72"/>
    <circle class="shutter" cx="235" cy="511" r="24"/>
    <text class="muted" x="58" y="518" font-size="18">[Space] Shutter</text>
    <text class="muted" x="286" y="518" font-size="18">[Z] Zoom</text>
    <rect class="kbd" x="35" y="565" width="400" height="80" rx="16"/>
    <g transform="translate(58,584)">
      <rect class="key" x="0" y="0" width="42" height="24"/><rect class="key" x="48" y="0" width="42" height="24"/><rect class="key" x="96" y="0" width="42" height="24"/><rect class="key" x="144" y="0" width="42" height="24"/><rect class="key" x="192" y="0" width="42" height="24"/><rect class="key" x="240" y="0" width="42" height="24"/><rect class="key" x="288" y="0" width="42" height="24"/>
      <rect class="key" x="24" y="34" width="42" height="24"/><rect class="key" x="72" y="34" width="42" height="24"/><rect class="key" x="120" y="34" width="90" height="24"/><rect class="key" x="216" y="34" width="42" height="24"/><rect class="key" x="264" y="34" width="42" height="24"/>
    </g>
  </g>

  <g transform="translate(620,170)">
    <text class="txt" x="0" y="0" font-size="30" font-weight="700">2 · Pro / RAW / high-res</text>
    <rect class="device" x="0" y="30" width="470" height="640" rx="48"/>
    <rect class="screen" x="35" y="60" width="400" height="400" rx="24"/>
    <rect x="55" y="80" width="360" height="360" rx="18" fill="#090d14"/>
    <text class="txt" x="60" y="104" font-size="18">12:00</text>
    <text class="accent" x="142" y="104" font-size="18" font-weight="700">PRO · HIGH-RES</text>
    <rect class="panel" x="72" y="125" width="326" height="82"/>
    <text class="ok" x="92" y="156" font-size="22" font-weight="700">Rear 8192×6144 JPEG</text>
    <text class="muted" x="92" y="184" font-size="17">Public Camera2 path · quality test required</text>
    <rect class="panel" x="72" y="224" width="326" height="82"/>
    <text class="ok" x="92" y="255" font-size="22" font-weight="700">Rear RAW/DNG 4096×3072</text>
    <text class="muted" x="92" y="283" font-size="17">DNG metadata/color matrix validation</text>
    <rect class="panel" x="72" y="323" width="326" height="82"/>
    <text class="warn" x="92" y="354" font-size="22" font-weight="700">Vendor controls: gated</text>
    <text class="muted" x="92" y="382" font-size="17">No enum guessing; compare results first</text>
    <rect class="panel" x="35" y="475" width="400" height="72"/>
    <text class="muted" x="58" y="505" font-size="18">[R] RAW/HiRes</text>
    <text class="muted" x="202" y="505" font-size="18">[E] Exposure</text>
    <text class="muted" x="328" y="505" font-size="18">[F] Focus</text>
    <text class="muted" x="58" y="532" font-size="16">GCam reference only · Sable experiments measured</text>
    <rect class="kbd" x="35" y="565" width="400" height="80" rx="16"/>
    <g transform="translate(58,584)">
      <rect class="key" x="0" y="0" width="42" height="24"/><rect class="key" x="48" y="0" width="42" height="24"/><rect class="key" x="96" y="0" width="42" height="24"/><rect class="key" x="144" y="0" width="42" height="24"/><rect class="key" x="192" y="0" width="42" height="24"/><rect class="key" x="240" y="0" width="42" height="24"/><rect class="key" x="288" y="0" width="42" height="24"/>
      <rect class="key" x="24" y="34" width="42" height="24"/><rect class="key" x="72" y="34" width="42" height="24"/><rect class="key" x="120" y="34" width="90" height="24"/><rect class="key" x="216" y="34" width="42" height="24"/><rect class="key" x="264" y="34" width="42" height="24"/>
    </g>
  </g>

  <g transform="translate(1160,170)">
    <text class="txt" x="0" y="0" font-size="30" font-weight="700">3 · Video / stabilization</text>
    <rect class="device" x="0" y="30" width="470" height="640" rx="48"/>
    <rect class="screen" x="35" y="60" width="400" height="400" rx="24"/>
    <rect x="55" y="80" width="360" height="360" rx="18" fill="#111827"/>
    <text class="txt" x="60" y="104" font-size="18">12:00</text>
    <text class="accent" x="170" y="104" font-size="18" font-weight="700">VIDEO</text>
    <text class="warn" x="306" y="104" font-size="18">EIS test</text>
    <rect class="focus" x="92" y="142" width="286" height="164" rx="16"/>
    <line class="line" x1="92" y1="224" x2="378" y2="224"/>
    <line class="line" x1="235" y1="142" x2="235" y2="306"/>
    <text class="muted" x="112" y="336" font-size="20">1080p60 / EIS / bitrate matrix</text>
    <text class="muted" x="112" y="366" font-size="18">No Pixel-class claim · measured only</text>
    <rect class="panel" x="35" y="475" width="400" height="72"/>
    <circle cx="92" cy="511" r="16" fill="#ef4444"/>
    <text class="muted" x="120" y="518" font-size="18">[Space] Record</text>
    <text class="muted" x="274" y="518" font-size="18">[V] Still/Video</text>
    <rect class="kbd" x="35" y="565" width="400" height="80" rx="16"/>
    <g transform="translate(58,584)">
      <rect class="key" x="0" y="0" width="42" height="24"/><rect class="key" x="48" y="0" width="42" height="24"/><rect class="key" x="96" y="0" width="42" height="24"/><rect class="key" x="144" y="0" width="42" height="24"/><rect class="key" x="192" y="0" width="42" height="24"/><rect class="key" x="240" y="0" width="42" height="24"/><rect class="key" x="288" y="0" width="42" height="24"/>
      <rect class="key" x="24" y="34" width="42" height="24"/><rect class="key" x="72" y="34" width="42" height="24"/><rect class="key" x="120" y="34" width="90" height="24"/><rect class="key" x="216" y="34" width="42" height="24"/><rect class="key" x="264" y="34" width="42" height="24"/>
    </g>
  </g>

  <g transform="translate(1700,170)">
    <text class="txt" x="0" y="0" font-size="30" font-weight="700">4 · Review / compare</text>
    <rect class="device" x="0" y="30" width="470" height="640" rx="48"/>
    <rect class="screen" x="35" y="60" width="400" height="400" rx="24"/>
    <rect x="55" y="80" width="360" height="360" rx="18" fill="#0b1220"/>
    <text class="txt" x="60" y="104" font-size="18">12:00</text>
    <text class="accent" x="160" y="104" font-size="18" font-weight="700">LATEST CAPTURE</text>
    <rect class="panel" x="74" y="130" width="144" height="132"/>
    <text class="muted" x="96" y="200" font-size="18">Stock</text>
    <rect class="panel" x="252" y="130" width="144" height="132"/>
    <text class="muted" x="282" y="200" font-size="18">Sable</text>
    <rect class="focus" x="248" y="126" width="152" height="140" rx="18"/>
    <text class="ok" x="86" y="304" font-size="20">Same scene comparison</text>
    <text class="muted" x="86" y="334" font-size="18">Stock · GCam ref · Sable output</text>
    <text class="muted" x="86" y="364" font-size="18">Delete/share require user action</text>
    <rect class="panel" x="35" y="475" width="400" height="72"/>
    <text class="muted" x="58" y="505" font-size="18">[J/K] Prev/Next</text>
    <text class="muted" x="224" y="505" font-size="18">[D] Delete confirm</text>
    <text class="muted" x="58" y="532" font-size="16">[I] Metadata · EXIF location explicit</text>
    <rect class="kbd" x="35" y="565" width="400" height="80" rx="16"/>
    <g transform="translate(58,584)">
      <rect class="key" x="0" y="0" width="42" height="24"/><rect class="key" x="48" y="0" width="42" height="24"/><rect class="key" x="96" y="0" width="42" height="24"/><rect class="key" x="144" y="0" width="42" height="24"/><rect class="key" x="192" y="0" width="42" height="24"/><rect class="key" x="240" y="0" width="42" height="24"/><rect class="key" x="288" y="0" width="42" height="24"/>
      <rect class="key" x="24" y="34" width="42" height="24"/><rect class="key" x="72" y="34" width="42" height="24"/><rect class="key" x="120" y="34" width="90" height="24"/><rect class="key" x="216" y="34" width="42" height="24"/><rect class="key" x="264" y="34" width="42" height="24"/>
    </g>
  </g>

  <g transform="translate(80,930)">
    <rect class="panel" x="0" y="0" width="2040" height="540"/>
    <text class="txt" x="36" y="58" font-size="34" font-weight="700">Quality-opportunity matrix</text>
    <text class="muted" x="36" y="100" font-size="23">Sable Camera must pursue proven sensor/HAL capability instead of stopping at stock app behavior.</text>
    <g transform="translate(36,145)">
      <text class="accent" x="0" y="0" font-size="24" font-weight="700">Normal app baseline</text>
      <text class="txt" x="0" y="40" font-size="22">• Public rear/front cameras</text>
      <text class="txt" x="0" y="75" font-size="22">• Rear 8192×6144 JPEG</text>
      <text class="txt" x="0" y="110" font-size="22">• Front 6560×4928 JPEG</text>
      <text class="txt" x="0" y="145" font-size="22">• Rear 4096×3072 RAW/DNG</text>
    </g>
    <g transform="translate(560,145)">
      <text class="accent" x="0" y="0" font-size="24" font-weight="700">Measured experiments</text>
      <text class="txt" x="0" y="40" font-size="22">• Stock vs GCam reference vs Sable</text>
      <text class="txt" x="0" y="75" font-size="22">• HDR / MFNR / ZSL / EIS gates</text>
      <text class="txt" x="0" y="110" font-size="22">• Detail, color, noise, motion</text>
      <text class="txt" x="0" y="145" font-size="22">• No vendor enum guessing</text>
    </g>
    <g transform="translate(1120,145)">
      <text class="accent" x="0" y="0" font-size="24" font-weight="700">Privileged SableOS phase</text>
      <text class="txt" x="0" y="40" font-size="22">• Logical rear camera 3</text>
      <text class="txt" x="0" y="75" font-size="22">• Hidden tele camera 2</text>
      <text class="txt" x="0" y="110" font-size="22">• Vendor-coordinated zoom</text>
      <text class="txt" x="0" y="145" font-size="22">• Negative access tests required</text>
    </g>
    <g transform="translate(36,365)">
      <text class="ok" x="0" y="0" font-size="25" font-weight="700">Contract:</text>
      <text class="txt" x="120" y="0" font-size="25">Camera output improvement is a first-class goal, but every improvement must be measured, profile-owned and capability-gated.</text>
      <text class="warn" x="0" y="54" font-size="23">NO:</text>
      <text class="txt" x="52" y="54" font-size="23">GCam dependency, root camerapatch product dependency, Pixel-class claims, Titan 2 Elite inheritance, hidden-camera assumptions.</text>
    </g>
  </g>
</svg>
