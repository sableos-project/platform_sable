<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">SableOS Battery usage and health — Titan 2 keyboard-first visual target</title>
  <desc id="desc">Four Titan 2 square-display Settings screens above a physical keyboard showing Battery overview, usage, health and charging protection with strong keyboard focus and capability-gated unavailable states.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111c"/><stop offset="1" stop-color="#0b2740"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101e2c"/><stop offset="1" stop-color="#05090e"/></linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2027"/><stop offset="1" stop-color="#050608"/></linearGradient>
    <style>
      .title{font:800 42px system-ui,Segoe UI,sans-serif;fill:#f2f8ff}.subtitle{font:400 21px system-ui,Segoe UI,sans-serif;fill:#c0d3e5}.section{font:800 18px system-ui,Segoe UI,sans-serif;fill:#f4f9ff}.label{font:700 11px system-ui,Segoe UI,sans-serif;fill:#f6fbff}.small{font:500 9px system-ui,Segoe UI,sans-serif;fill:#c3d2e2}.tiny{font:500 7.5px system-ui,Segoe UI,sans-serif;fill:#aebfd0}.metric{font:800 20px system-ui,Segoe UI,sans-serif;fill:#f7fbff}.panel{fill:rgba(255,255,255,.045);stroke:#2c526f;stroke-width:1.5}.device{fill:url(#phone);stroke:#323b46;stroke-width:3}.screen{fill:url(#screen);stroke:#2e4155;stroke-width:1.5}.key{fill:#080a0d;stroke:#343b44;stroke-width:.8}.row{fill:rgba(255,255,255,.055);stroke:rgba(255,255,255,.12);stroke-width:.8}.focus{fill:#0a66b3;stroke:#69c3ff;stroke-width:1.5}.disabled{fill:rgba(255,255,255,.025);stroke:#45515d;stroke-width:.8}.blue{fill:#1687ff}.green{fill:#20c46a}.orange{fill:#f6a524}.purple{fill:#7b65ff}.gray{fill:#697888}.hint{fill:#0b1723;stroke:#31516b;stroke-width:1}.bar{fill:#1687ff}.bar2{fill:#20c46a}.grid{stroke:#294155;stroke-width:.6}
    </style>
    <g id="titan">
      <rect width="220" height="382" rx="23" class="device"/>
      <rect x="17" y="20" width="186" height="168" rx="9" class="screen"/>
      <path d="M58 4h104v14H58z" fill="#090b0e" stroke="#394552"/><path d="M141 5h39v20h-39z" fill="#090b0e" stroke="#394552"/>
      <g transform="translate(17 197)"><rect width="186" height="30" fill="#0b0d11" stroke="#303842"/><rect x="4" y="5" width="35" height="19" rx="3" class="key"/><rect x="43" y="5" width="35" height="19" rx="3" class="key"/><rect x="82" y="5" width="35" height="19" rx="3" class="key"/><rect x="121" y="5" width="25" height="19" rx="3" class="key"/><rect x="150" y="5" width="31" height="19" rx="3" class="key"/><text x="13" y="18" class="tiny">⌂</text><text x="50" y="18" class="tiny">sym</text><text x="92" y="18" class="tiny">◁</text><text x="129" y="18" class="tiny">fn</text><text x="158" y="18" class="tiny">alt</text></g>
      <g transform="translate(17 232)"><rect width="186" height="125" fill="#06070a" stroke="#303842"/>
        <g transform="translate(4 6)"><rect width="24" height="21" rx="3" class="key"/><rect x="27" width="24" height="21" rx="3" class="key"/><rect x="54" width="24" height="21" rx="3" class="key"/><rect x="81" width="24" height="21" rx="3" class="key"/><rect x="108" width="24" height="21" rx="3" class="key"/><rect x="135" width="24" height="21" rx="3" class="key"/><rect x="162" width="20" height="21" rx="3" class="key"/><text x="8" y="15" class="tiny">Q</text><text x="35" y="15" class="tiny">W</text><text x="62" y="15" class="tiny">E</text><text x="89" y="15" class="tiny">R</text><text x="116" y="15" class="tiny">T</text><text x="143" y="15" class="tiny">Y</text></g>
        <g transform="translate(4 34)"><rect width="24" height="21" rx="3" class="key"/><rect x="27" width="24" height="21" rx="3" class="key"/><rect x="54" width="24" height="21" rx="3" class="key"/><rect x="81" width="24" height="21" rx="3" class="key"/><rect x="108" width="24" height="21" rx="3" class="key"/><rect x="135" width="24" height="21" rx="3" class="key"/><rect x="162" width="20" height="21" rx="3" class="key"/><text x="8" y="15" class="tiny">A</text><text x="35" y="15" class="tiny">S</text><text x="62" y="15" class="tiny">D</text><text x="89" y="15" class="tiny">F</text><text x="116" y="15" class="tiny">G</text><text x="143" y="15" class="tiny">H</text></g>
        <g transform="translate(4 62)"><rect width="24" height="21" rx="3" class="key"/><rect x="27" width="24" height="21" rx="3" class="key"/><rect x="54" width="24" height="21" rx="3" class="key"/><rect x="81" width="53" height="21" rx="3" class="key"/><rect x="137" width="22" height="21" rx="3" class="key"/><rect x="162" width="20" height="21" rx="3" class="key"/><text x="8" y="15" class="tiny">Z</text><text x="35" y="15" class="tiny">X</text><text x="62" y="15" class="tiny">C</text><text x="98" y="15" class="tiny">—</text><text x="143" y="15" class="tiny">B</text></g>
      </g>
    </g>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="32" y="49" class="title">Sable Settings — Battery usage, health &amp; charging</text>
  <text x="34" y="79" class="subtitle">Titan 2 target · square display + physical keyboard · Android Settings location · capability-gated health/control data</text>

  <g transform="translate(28 110)"><rect width="300" height="530" rx="13" class="panel"/><text x="17" y="29" class="section">1. Battery overview</text><use href="#titan" x="40" y="58"/>
    <g transform="translate(57 79)"><text x="10" y="18" class="tiny">10:46</text><text x="143" y="18" class="tiny">5G 74%</text><text x="10" y="42" class="label">Battery</text><text x="10" y="66" class="metric">74%</text><text x="55" y="63" class="tiny">Charging · 38 min to full</text>
      <rect x="7" y="78" width="172" height="27" rx="6" class="focus"/><circle cx="22" cy="91" r="7" class="blue"/><text x="38" y="91" class="label">Battery usage</text><text x="38" y="101" class="tiny">Today · top consumers</text>
      <rect x="10" y="110" width="166" height="25" rx="6" class="row"/><circle cx="24" cy="122" r="7" class="green"/><text x="40" y="125" class="label">Battery health</text>
      <rect x="10" y="140" width="166" height="25" rx="6" class="row"/><circle cx="24" cy="152" r="7" class="orange"/><text x="40" y="155" class="label">Charging &amp; protection</text>
    </g><text x="18" y="512" class="small">↑↓ focus · Enter open · / search</text></g>

  <g transform="translate(344 110)"><rect width="300" height="530" rx="13" class="panel"/><text x="17" y="29" class="section">2. Usage</text><use href="#titan" x="40" y="58"/>
    <g transform="translate(57 79)"><text x="10" y="18" class="tiny">10:46</text><text x="10" y="40" class="label">Battery usage</text><rect x="10" y="49" width="166" height="19" rx="6" class="row"/><text x="24" y="62" class="tiny">Today        24 hours        7 days</text>
      <rect x="10" y="76" width="166" height="49" rx="6" class="focus"/><line x1="17" y1="112" x2="169" y2="112" class="grid"/><rect x="20" y="99" width="10" height="13" class="bar"/><rect x="36" y="92" width="10" height="20" class="bar"/><rect x="52" y="84" width="10" height="28" class="bar2"/><rect x="68" y="89" width="10" height="23" class="bar2"/><rect x="84" y="78" width="10" height="34" class="bar2"/><rect x="100" y="94" width="10" height="18" class="bar"/><rect x="116" y="101" width="10" height="11" class="bar"/><rect x="132" y="105" width="10" height="7" class="bar"/><text x="17" y="122" class="tiny">←→ inspect time · Enter inspect</text>
      <rect x="10" y="132" width="166" height="22" rx="5" class="row"/><text x="20" y="146" class="tiny">Screen</text><text x="149" y="146" class="tiny">24%</text><rect x="7" y="158" width="172" height="25" rx="6" class="focus"/><text x="20" y="173" class="label">Mobile network</text><text x="149" y="173" class="label">17%</text>
    </g><text x="18" y="512" class="small">Chart has a keyboard inspection mode; no gesture-only data.</text></g>

  <g transform="translate(660 110)"><rect width="300" height="530" rx="13" class="panel"/><text x="17" y="29" class="section">3. Health</text><use href="#titan" x="40" y="58"/>
    <g transform="translate(57 79)"><text x="10" y="18" class="tiny">10:46</text><text x="10" y="40" class="label">Battery health</text><text x="10" y="56" class="tiny">Example partial-data state</text>
      <rect x="10" y="68" width="166" height="28" rx="6" class="row"/><text x="20" y="80" class="tiny">Maximum capacity</text><text x="20" y="91" class="label">Not reported</text>
      <rect x="10" y="101" width="166" height="28" rx="6" class="row"/><text x="20" y="113" class="tiny">Cycle count</text><text x="20" y="124" class="label">Not reported</text>
      <rect x="7" y="134" width="172" height="29" rx="6" class="focus"/><text x="20" y="146" class="tiny">Data quality</text><text x="20" y="157" class="label">Partial · source shown</text>
      <rect x="10" y="169" width="166" height="25" rx="6" class="row"/><text x="20" y="184" class="label">Temperature trend</text>
    </g><text x="18" y="512" class="small">Unavailable beats fabricated health percentages or battery age.</text></g>

  <g transform="translate(976 110)"><rect width="300" height="530" rx="13" class="panel"/><text x="17" y="29" class="section">4. Charging &amp; protection</text><use href="#titan" x="40" y="58"/>
    <g transform="translate(57 79)"><text x="10" y="18" class="tiny">10:46</text><text x="10" y="40" class="label">Charging &amp; protection</text><rect x="7" y="55" width="172" height="35" rx="6" class="focus"/><text x="20" y="69" class="label">Charge limit</text><text x="20" y="82" class="tiny">Not qualified on this device</text>
      <rect x="10" y="97" width="166" height="35" rx="6" class="disabled"/><text x="20" y="111" class="label">Adaptive charging</text><text x="20" y="124" class="tiny">Validated backend required</text>
      <rect x="10" y="139" width="166" height="29" rx="6" class="row"/><text x="20" y="157" class="label">Battery saver</text><text x="146" y="157" class="tiny">Off</text>
      <rect x="10" y="174" width="166" height="24" rx="6" class="hint"/><text x="18" y="189" class="tiny">No raw sysfs control from common UI</text>
    </g><text x="18" y="512" class="small">Disabled/unavailable state is a first-class supported UI state.</text></g>

  <g transform="translate(1292 110)"><rect width="280" height="530" rx="13" class="panel"/><text x="17" y="29" class="section">5. Keyboard contract</text>
    <rect x="18" y="62" width="244" height="42" rx="8" class="focus"/><text x="31" y="79" class="label">Deterministic visible focus</text><text x="31" y="94" class="tiny">focus survives detail/back transitions</text>
    <rect x="18" y="118" width="244" height="62" rx="8" class="row"/><text x="31" y="138" class="label">Usage chart</text><text x="31" y="153" class="tiny">Enter inspect · ←→ bucket · Esc exit</text><text x="31" y="168" class="tiny">selected value is exposed as text</text>
    <rect x="18" y="194" width="244" height="62" rx="8" class="row"/><text x="31" y="214" class="label">Settings type-ahead</text><text x="31" y="229" class="tiny">U Usage · H Health · C Charging</text><text x="31" y="244" class="tiny">/ opens full Settings search</text>
    <rect x="18" y="270" width="244" height="83" rx="8" class="row"/><text x="31" y="290" class="label">Truthful capability states</text><text x="31" y="306" class="tiny">Measured / estimated / unavailable</text><text x="31" y="321" class="tiny">No inferred cycle count by default</text><text x="31" y="336" class="tiny">No fake charge-limit switch</text>
    <rect x="18" y="367" width="244" height="83" rx="8" class="row"/><text x="31" y="387" class="label">Privacy &amp; efficiency</text><text x="31" y="403" class="tiny">Local-only analytics</text><text x="31" y="418" class="tiny">No continuous background polling</text><text x="31" y="433" class="tiny">No cloud battery profile</text>
  </g>

  <g transform="translate(28 670)"><rect width="480" height="140" rx="12" class="panel"/><text x="17" y="30" class="section">Platform boundary</text><text x="17" y="58" class="small">S1.7 PowerSnapshot stays frozen for level/charging/source.</text><text x="17" y="84" class="small">Usage uses Android accounting; health facts are availability-aware.</text><text x="17" y="110" class="small">Mutable charging controls require a validated device adapter.</text></g>
  <g transform="translate(528 670)"><rect width="480" height="140" rx="12" class="panel"/><text x="17" y="30" class="section">Device portability</text><text x="17" y="58" class="small">Panther PASS != Titan 2 PASS != Titan 2 Elite PASS != Q27 PASS.</text><text x="17" y="84" class="small">Each target records battery-health and charging-control capabilities.</text><text x="17" y="110" class="small">Unsupported data remains honest and usable.</text></g>
  <g transform="translate(1028 670)"><rect width="544" height="140" rx="12" class="panel"/><text x="17" y="30" class="section">Validation target</text><text x="17" y="58" class="small">Square display + physical keyboard; no slab-phone visual target.</text><text x="17" y="84" class="small">Keyboard-only operation, touch fallback, font scale and screen reader.</text><text x="17" y="110" class="small">Visual artifact does not claim Titan 2 health/control backend support.</text></g>
</svg>