<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Sable Settings Titan 2 approved visual target</title>
  <desc id="desc">Corrected Titan 2 hardware-proportion visual target for Sable Settings. All settings screens use a square display above a physical keyboard and avoid slab-phone proportions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111c"/><stop offset="1" stop-color="#0b2740"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101e2c"/><stop offset="1" stop-color="#05090e"/></linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2027"/><stop offset="1" stop-color="#050608"/></linearGradient>
    <style>
      .title{font:800 44px system-ui,Segoe UI,sans-serif;fill:#f2f8ff}.subtitle{font:400 22px system-ui,Segoe UI,sans-serif;fill:#c0d3e5}.section{font:800 18px system-ui,Segoe UI,sans-serif;fill:#f4f9ff}.label{font:700 12px system-ui,Segoe UI,sans-serif;fill:#f6fbff}.small{font:500 10px system-ui,Segoe UI,sans-serif;fill:#c3d2e2}.tiny{font:500 8px system-ui,Segoe UI,sans-serif;fill:#aebfd0}.panel{fill:rgba(255,255,255,.045);stroke:#2c526f;stroke-width:1.5}.device{fill:url(#phone);stroke:#323b46;stroke-width:3}.screen{fill:url(#screen);stroke:#2e4155;stroke-width:1.5}.key{fill:#080a0d;stroke:#343b44;stroke-width:.8}.row{fill:rgba(255,255,255,.055);stroke:rgba(255,255,255,.12);stroke-width:.8}.focus{fill:#0a66b3;stroke:#69c3ff;stroke-width:1.5}.blue{fill:#1687ff}.green{fill:#20c46a}.red{fill:#ff5168}.orange{fill:#f6a524}.yellow{fill:#ffd14a}.purple{fill:#7b65ff}.gray{fill:#697888}.hint{fill:#0b1723;stroke:#31516b;stroke-width:1}
    </style>
    <g id="titan2-frame">
      <rect x="0" y="0" width="210" height="360" rx="22" class="device"/>
      <rect x="16" y="20" width="178" height="160" rx="9" class="screen"/>
      <path d="M55 4h100v14H55z" fill="#090b0e" stroke="#394552" stroke-width="1"/><path d="M134 5h38v20h-38z" fill="#090b0e" stroke="#394552" stroke-width="1"/>
      <g transform="translate(16 188)"><rect width="178" height="28" fill="#0b0d11" stroke="#303842"/><rect x="4" y="5" width="34" height="18" rx="3" class="key"/><rect x="42" y="5" width="34" height="18" rx="3" class="key"/><rect x="80" y="5" width="34" height="18" rx="3" class="key"/><rect x="118" y="5" width="24" height="18" rx="3" class="key"/><rect x="146" y="5" width="28" height="18" rx="3" class="key"/><text x="13" y="18" class="tiny">⌂</text><text x="50" y="18" class="tiny">sym</text><text x="91" y="18" class="tiny">◁</text><text x="126" y="18" class="tiny">fn</text><text x="153" y="18" class="tiny">alt</text></g>
      <g transform="translate(16 220)"><rect width="178" height="118" fill="#06070a" stroke="#303842"/>
        <g transform="translate(4 5)"><rect width="23" height="20" rx="3" class="key"/><rect x="26" width="23" height="20" rx="3" class="key"/><rect x="52" width="23" height="20" rx="3" class="key"/><rect x="78" width="23" height="20" rx="3" class="key"/><rect x="104" width="23" height="20" rx="3" class="key"/><rect x="130" width="23" height="20" rx="3" class="key"/><rect x="156" width="18" height="20" rx="3" class="key"/><text x="7" y="15" class="tiny">Q</text><text x="33" y="15" class="tiny">W</text><text x="59" y="15" class="tiny">E</text><text x="85" y="15" class="tiny">R</text><text x="111" y="15" class="tiny">T</text><text x="137" y="15" class="tiny">Y</text></g>
        <g transform="translate(4 31)"><rect width="23" height="20" rx="3" class="key"/><rect x="26" width="23" height="20" rx="3" class="key"/><rect x="52" width="23" height="20" rx="3" class="key"/><rect x="78" width="23" height="20" rx="3" class="key"/><rect x="104" width="23" height="20" rx="3" class="key"/><rect x="130" width="23" height="20" rx="3" class="key"/><rect x="156" width="18" height="20" rx="3" class="key"/><text x="7" y="15" class="tiny">A</text><text x="33" y="15" class="tiny">S</text><text x="59" y="15" class="tiny">D</text><text x="85" y="15" class="tiny">F</text><text x="111" y="15" class="tiny">G</text><text x="137" y="15" class="tiny">H</text></g>
        <g transform="translate(4 57)"><rect width="23" height="20" rx="3" class="key"/><rect x="26" width="23" height="20" rx="3" class="key"/><rect x="52" width="23" height="20" rx="3" class="key"/><rect x="78" width="50" height="20" rx="3" class="key"/><rect x="131" width="22" height="20" rx="3" class="key"/><rect x="156" width="18" height="20" rx="3" class="key"/><text x="7" y="15" class="tiny">Z</text><text x="33" y="15" class="tiny">X</text><text x="59" y="15" class="tiny">C</text><text x="93" y="15" class="tiny">—</text><text x="137" y="15" class="tiny">B</text></g>
      </g>
    </g>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="32" y="48" class="title">Sable Settings — Keyboard-First UX</text>
  <text x="34" y="78" class="subtitle">Titan 2 visual template: square display + physical keyboard · familiar Android Settings · no launcher base bar</text>

  <g transform="translate(24 104)"><rect width="256" height="500" rx="12" class="panel"/><text x="16" y="28" class="section">1. Settings Home</text><use href="#titan2-frame" x="23" y="56"/>
    <g transform="translate(39 76)"><text x="10" y="20" class="tiny">10:46  ⚙</text><text x="128" y="20" class="tiny">5G 99%</text><text x="10" y="45" class="label">Settings</text><rect x="10" y="56" width="158" height="25" rx="7" class="row"/><text x="22" y="72" class="small">⌕ Search settings</text><rect x="10" y="92" width="158" height="24" rx="6" class="row"/><circle cx="24" cy="104" r="8" class="blue"/><text x="42" y="108" class="label">Network &amp; internet</text><rect x="10" y="121" width="158" height="24" rx="6" class="row"/><circle cx="24" cy="133" r="8" class="green"/><text x="42" y="137" class="label">Connected devices</text><rect x="10" y="150" width="158" height="24" rx="6" class="row"/><circle cx="24" cy="162" r="8" class="gray"/><text x="42" y="166" class="label">Apps</text><rect x="10" y="179" width="158" height="24" rx="6" class="row"/><circle cx="24" cy="191" r="8" class="orange"/><text x="42" y="195" class="label">Display</text><rect x="7" y="207" width="164" height="28" rx="7" class="focus"/><circle cx="24" cy="221" r="8" class="blue"/><text x="42" y="218" class="label">Keyboard &amp; input</text><text x="42" y="230" class="tiny">Physical keyboard, typing</text><rect x="10" y="240" width="158" height="24" rx="6" class="row"/><circle cx="24" cy="252" r="8" class="purple"/><text x="42" y="256" class="label">Privacy &amp; security</text></g>
    <text x="16" y="474" class="small">Top search + Android Settings categories.</text></g>

  <g transform="translate(294 104)"><rect width="256" height="500" rx="12" class="panel"/><text x="16" y="28" class="section">2. Search</text><use href="#titan2-frame" x="23" y="56"/>
    <g transform="translate(39 76)"><text x="10" y="20" class="tiny">10:46</text><text x="128" y="20" class="tiny">5G 99%</text><rect x="10" y="42" width="158" height="28" rx="7" class="row"/><text x="22" y="60" class="small">⌕ sy</text><text x="154" y="60" class="small">×</text><rect x="7" y="84" width="164" height="31" rx="7" class="focus"/><circle cx="23" cy="99" r="8" class="gray"/><text x="42" y="99" class="label">System</text><text x="42" y="111" class="tiny">Languages, backup</text><rect x="10" y="128" width="158" height="28" rx="6" class="row"/><circle cx="24" cy="142" r="8" class="blue"/><text x="42" y="143" class="label">Keyboard shortcuts</text><rect x="10" y="162" width="158" height="28" rx="6" class="row"/><circle cx="24" cy="176" r="8" class="purple"/><text x="42" y="177" class="label">Security &amp; privacy</text></g>
    <text x="16" y="474" class="small">S then Y focuses System; / opens search.</text></g>

  <g transform="translate(564 104)"><rect width="256" height="500" rx="12" class="panel"/><text x="16" y="28" class="section">3. Keyboard &amp; Input</text><use href="#titan2-frame" x="23" y="56"/>
    <g transform="translate(39 76)"><text x="10" y="20" class="tiny">10:46</text><text x="10" y="45" class="label">Keyboard &amp; input</text><rect x="7" y="62" width="164" height="30" rx="7" class="focus"/><circle cx="24" cy="77" r="8" class="blue"/><text x="42" y="75" class="label">Physical keyboard</text><text x="42" y="87" class="tiny">Titan 2 layout, shortcuts</text><rect x="10" y="101" width="158" height="30" rx="7" class="row"/><circle cx="24" cy="116" r="8" class="blue"/><text x="42" y="117" class="label">On-screen keyboard</text><rect x="10" y="139" width="158" height="30" rx="7" class="row"/><circle cx="24" cy="154" r="8" class="gray"/><text x="42" y="155" class="label">Pointer &amp; touchpad</text><rect x="10" y="177" width="158" height="30" rx="7" class="row"/><circle cx="24" cy="192" r="8" class="green"/><text x="42" y="193" class="label">Typing tests</text></g>
    <text x="16" y="474" class="small">Alt/Sym/Fn text-entry behavior is validated here.</text></g>

  <g transform="translate(834 104)"><rect width="256" height="500" rx="12" class="panel"/><text x="16" y="28" class="section">4. Diagnostics</text><use href="#titan2-frame" x="23" y="56"/>
    <g transform="translate(39 76)"><text x="10" y="20" class="tiny">10:46</text><text x="10" y="45" class="label">Diagnostics</text><text x="10" y="60" class="tiny">Hardware tests and logs</text><rect x="7" y="75" width="76" height="36" rx="7" class="focus"/><circle cx="23" cy="93" r="8" class="orange"/><text x="40" y="97" class="tiny">Display</text><rect x="92" y="75" width="76" height="36" rx="7" class="row"/><circle cx="108" cy="93" r="8" class="blue"/><text x="125" y="97" class="tiny">Keyboard</text><rect x="10" y="122" width="158" height="30" rx="7" class="row"/><circle cx="24" cy="137" r="8" class="purple"/><text x="42" y="138" class="label">Factory test bridge</text><rect x="10" y="158" width="158" height="30" rx="7" class="row"/><circle cx="24" cy="173" r="8" class="gray"/><text x="42" y="174" class="label">Export redacted logs</text><rect x="10" y="198" width="158" height="26" rx="6" class="hint"/><text x="24" y="215" class="tiny">*#*#3377#*#* gated</text></g>
    <text x="16" y="474" class="small">Factory test is visible but gated; no one-tap raw launch.</text></g>

  <g transform="translate(1104 104)"><rect width="256" height="500" rx="12" class="panel"/><text x="16" y="28" class="section">5. Connected Devices</text><use href="#titan2-frame" x="23" y="56"/>
    <g transform="translate(39 76)"><text x="10" y="20" class="tiny">10:46</text><text x="10" y="45" class="label">Connected devices</text><rect x="7" y="62" width="164" height="30" rx="7" class="focus"/><circle cx="24" cy="77" r="8" class="blue"/><text x="42" y="79" class="label">Pair new device</text><rect x="10" y="101" width="158" height="30" rx="7" class="row"/><circle cx="24" cy="116" r="8" class="green"/><text x="42" y="117" class="label">Titan 2 Keyboard</text><rect x="10" y="139" width="158" height="30" rx="7" class="row"/><circle cx="24" cy="154" r="8" class="gray"/><text x="42" y="155" class="label">USB</text><rect x="10" y="177" width="158" height="30" rx="7" class="row"/><circle cx="24" cy="192" r="8" class="orange"/><text x="42" y="193" class="label">Printing</text></g>
    <text x="16" y="474" class="small">Pairing dialogs must pass critical text-entry gates.</text></g>

  <g transform="translate(1374 104)"><rect width="202" height="500" rx="12" class="panel"/><text x="16" y="28" class="section">6. System</text><use href="#titan2-frame" x="-4" y="56"/>
    <g transform="translate(12 76)"><text x="10" y="20" class="tiny">10:46</text><text x="10" y="45" class="label">System</text><rect x="7" y="62" width="164" height="30" rx="7" class="focus"/><circle cx="24" cy="77" r="8" class="blue"/><text x="42" y="79" class="label">Languages</text><rect x="10" y="101" width="158" height="30" rx="7" class="row"/><circle cx="24" cy="116" r="8" class="gray"/><text x="42" y="117" class="label">Date &amp; time</text><rect x="10" y="139" width="158" height="30" rx="7" class="row"/><circle cx="24" cy="154" r="8" class="purple"/><text x="42" y="155" class="label">Backup</text><rect x="10" y="177" width="158" height="30" rx="7" class="row"/><circle cx="24" cy="192" r="8" class="orange"/><text x="42" y="193" class="label">About phone</text></g>
    <text x="16" y="474" class="small">Android-compatible System section.</text></g>

  <g transform="translate(24 632)"><rect width="360" height="128" rx="12" class="panel"/><text x="16" y="28" class="section">Keyboard shortcuts</text><text x="16" y="56" class="small">↑↓ move · Enter open · / search · Back return</text><text x="16" y="86" class="small">Letters type-ahead; Alt/Sym/Fn enter symbols in text fields</text></g>
  <g transform="translate(400 632)"><rect width="360" height="128" rx="12" class="panel"/><text x="16" y="28" class="section">Mouse / pointer</text><text x="16" y="56" class="small">Hover does not steal focus · click activates · scroll lists</text><text x="16" y="86" class="small">Pointer complements keyboard; no hidden focus traps</text></g>
  <g transform="translate(776 632)"><rect width="360" height="128" rx="12" class="panel"/><text x="16" y="28" class="section">Base-bar decision</text><text x="16" y="56" class="small">Settings does not include the Sable Start base quick bar.</text><text x="16" y="86" class="small">System Back/Home navigation only; optional shortcut hint footer.</text></g>
  <g transform="translate(1152 632)"><rect width="416" height="128" rx="12" class="panel"/><text x="16" y="28" class="section">Validation target</text><text x="16" y="56" class="small">All screens use Titan 2 proportions: square display plus physical keyboard.</text><text x="16" y="86" class="small">No slab-phone or stretched display visual target.</text></g>
</svg>
