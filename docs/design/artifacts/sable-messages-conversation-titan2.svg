<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Sable Messages / Conversation UX for Titan 2</title>
  <desc id="desc">Titan 2 square-display visual target for latest-anchored messages, keyboard composition, explicit history mode and privacy redaction.</desc>
  <defs>
    <style>
      .bg { fill: #111318; }
      .device { fill: #20242d; stroke: #4a5261; stroke-width: 6; }
      .screen { fill: #0c0f14; stroke: #7e8797; stroke-width: 4; }
      .panel { fill: #151a22; stroke: #343b48; stroke-width: 3; rx: 18; }
      .panel2 { fill: #10141b; stroke: #303746; stroke-width: 2; rx: 14; }
      .ink { fill: #f5f7fb; font-family: Inter, Arial, sans-serif; }
      .muted { fill: #aab2c0; font-family: Inter, Arial, sans-serif; }
      .tiny { font-size: 18px; }
      .small { font-size: 22px; }
      .med { font-size: 27px; font-weight: 600; }
      .big { font-size: 34px; font-weight: 700; }
      .accent { fill: #7dd3fc; }
      .ok { fill: #7ee787; }
      .warn { fill: #ffd166; }
      .danger { fill: #ff7b72; }
      .bubbleIn { fill: #1f2937; stroke: #3b4556; stroke-width: 2; }
      .bubbleOut { fill: #124559; stroke: #2dd4bf; stroke-width: 2; }
      .focus { fill: none; stroke: #7dd3fc; stroke-width: 4; rx: 14; }
      .key { fill: #303644; stroke: #687184; stroke-width: 2; rx: 8; }
      .keyText { fill: #f5f7fb; font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 700; }
      .line { stroke: #3b4556; stroke-width: 2; }
      .chip { fill: #263242; stroke: #4b5565; stroke-width: 2; rx: 14; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="1600"/>
  <text class="ink big" x="60" y="70">Sable Messages / Conversation UX</text>
  <text class="muted small" x="60" y="106">Latest message is always visible · no touchpad-style scrolling dependency</text>

  <!-- Titan 2 hardware template -->
  <rect class="device" x="250" y="140" width="700" height="1320" rx="80"/>
  <rect class="screen" x="305" y="205" width="590" height="590" rx="34"/>
  <circle cx="600" cy="174" r="8" fill="#6b7280"/>

  <!-- Screen top header -->
  <rect class="panel" x="330" y="230" width="540" height="64" rx="18"/>
  <text class="ink med" x="350" y="272">Maya Patel</text>
  <text class="muted tiny" x="700" y="268">SMS · Private OK</text>

  <!-- Latest anchored conversation window -->
  <rect class="panel2" x="330" y="310" width="540" height="325" rx="18"/>
  <text class="muted tiny" x="350" y="338">Recent context · anchored to latest</text>

  <rect class="bubbleIn" x="350" y="355" width="310" height="54" rx="16"/>
  <text class="ink small" x="368" y="390">Train arrives 7:18</text>
  <text class="muted tiny" x="678" y="390">7:09</text>

  <rect class="bubbleOut" x="498" y="420" width="350" height="58" rx="16"/>
  <text class="ink small" x="516" y="457">I’ll meet you outside.</text>
  <text class="muted tiny" x="433" y="456">7:10</text>

  <rect class="bubbleIn" x="350" y="494" width="372" height="70" rx="16"/>
  <text class="ink small" x="368" y="526">Just got off. Latest msg</text>
  <text class="ok tiny" x="368" y="552">VISIBLE · auto-advanced</text>
  <text class="muted tiny" x="742" y="535">7:12</text>
  <rect class="focus" x="344" y="488" width="386" height="82" rx="18"/>

  <rect class="chip" x="350" y="585" width="305" height="34" rx="14"/>
  <text class="accent tiny" x="366" y="608">End/Ctrl+L returns to latest</text>

  <!-- Composer -->
  <rect class="panel" x="330" y="650" width="540" height="92" rx="18"/>
  <text class="muted tiny" x="350" y="679">Composer · physical keyboard primary</text>
  <rect x="350" y="690" width="410" height="36" rx="10" fill="#0b1220" stroke="#3b4556" stroke-width="2"/>
  <text class="ink tiny" x="365" y="714">Typing reply…</text>
  <rect x="775" y="690" width="72" height="36" rx="10" fill="#0e7490"/>
  <text class="ink tiny" x="790" y="714">Send</text>

  <!-- Onscreen fallback strip -->
  <rect class="panel2" x="330" y="754" width="540" height="28" rx="10"/>
  <text class="warn tiny" x="350" y="775">Onscreen keyboard fallback keeps draft + latest visible</text>

  <!-- Physical keyboard -->
  <g transform="translate(315 835)">
    <rect class="panel" x="0" y="0" width="570" height="520" rx="34"/>
    <text class="muted tiny" x="30" y="38">Titan 2 physical keyboard</text>
    <g transform="translate(28 70)">
      <rect class="key" x="0" y="0" width="55" height="42"/><text class="keyText" x="18" y="28">Q</text>
      <rect class="key" x="64" y="0" width="55" height="42"/><text class="keyText" x="82" y="28">W</text>
      <rect class="key" x="128" y="0" width="55" height="42"/><text class="keyText" x="147" y="28">E</text>
      <rect class="key" x="192" y="0" width="55" height="42"/><text class="keyText" x="210" y="28">R</text>
      <rect class="key" x="256" y="0" width="55" height="42"/><text class="keyText" x="275" y="28">T</text>
      <rect class="key" x="320" y="0" width="55" height="42"/><text class="keyText" x="338" y="28">Y</text>
      <rect class="key" x="384" y="0" width="55" height="42"/><text class="keyText" x="401" y="28">U</text>
      <rect class="key" x="448" y="0" width="55" height="42"/><text class="keyText" x="467" y="28">I</text>

      <rect class="key" x="32" y="56" width="55" height="42"/><text class="keyText" x="50" y="84">A</text>
      <rect class="key" x="96" y="56" width="55" height="42"/><text class="keyText" x="115" y="84">S</text>
      <rect class="key" x="160" y="56" width="55" height="42"/><text class="keyText" x="178" y="84">D</text>
      <rect class="key" x="224" y="56" width="55" height="42"/><text class="keyText" x="243" y="84">F</text>
      <rect class="key" x="288" y="56" width="55" height="42"/><text class="keyText" x="307" y="84">G</text>
      <rect class="key" x="352" y="56" width="55" height="42"/><text class="keyText" x="370" y="84">H</text>
      <rect class="key" x="416" y="56" width="55" height="42"/><text class="keyText" x="437" y="84">J</text>

      <rect class="key" x="64" y="112" width="55" height="42"/><text class="keyText" x="82" y="140">Z</text>
      <rect class="key" x="128" y="112" width="55" height="42"/><text class="keyText" x="147" y="140">X</text>
      <rect class="key" x="192" y="112" width="55" height="42"/><text class="keyText" x="211" y="140">C</text>
      <rect class="key" x="256" y="112" width="55" height="42"/><text class="keyText" x="274" y="140">V</text>
      <rect class="key" x="320" y="112" width="55" height="42"/><text class="keyText" x="337" y="140">B</text>
      <rect class="key" x="384" y="112" width="55" height="42"/><text class="keyText" x="401" y="140">N</text>
    </g>
    <rect class="chip" x="30" y="260" width="220" height="38" rx="14"/>
    <text class="accent tiny" x="48" y="285">Enter sends</text>
    <rect class="chip" x="270" y="260" width="250" height="38" rx="14"/>
    <text class="accent tiny" x="288" y="285">Shift+Enter newline</text>
    <rect class="chip" x="30" y="315" width="490" height="38" rx="14"/>
    <text class="accent tiny" x="48" y="340">/ search · PageUp history · End latest</text>
  </g>

  <!-- Side panels: rules -->
  <rect class="panel" x="60" y="205" width="205" height="590" rx="24"/>
  <text class="ink med" x="80" y="248">Validation</text>
  <text class="ok tiny" x="80" y="292">LATEST_MESSAGE_ALWAYS_VISIBLE</text>
  <text class="ok tiny" x="80" y="324">AUTO_ADVANCE_ON_INCOMING</text>
  <text class="ok tiny" x="80" y="356">AUTO_ADVANCE_ON_SEND</text>
  <text class="ok tiny" x="80" y="388">OPEN_AT_LATEST</text>
  <text class="ok tiny" x="80" y="420">RETURN_TO_LATEST_KEY</text>
  <text class="warn tiny" x="80" y="468">SCROLLING_REQUIRED=NO</text>
  <text class="warn tiny" x="80" y="500">TOUCHPAD_DEPENDENCY=NO</text>
  <text class="muted tiny" x="80" y="548">History is explicit:</text>
  <text class="muted tiny" x="80" y="580">search, date jump,</text>
  <text class="muted tiny" x="80" y="612">unread jump, page mode</text>

  <rect class="panel" x="935" y="205" width="205" height="590" rx="24"/>
  <text class="ink med" x="955" y="248">History mode</text>
  <rect class="panel2" x="955" y="275" width="165" height="112" rx="16"/>
  <text class="muted tiny" x="970" y="306">Older page</text>
  <text class="ink tiny" x="970" y="334">Yesterday 9:42</text>
  <text class="ink tiny" x="970" y="362">Earlier context…</text>
  <rect class="chip" x="955" y="405" width="165" height="50" rx="14"/>
  <text class="accent tiny" x="968" y="428">New message</text>
  <text class="accent tiny" x="968" y="450">Enter latest</text>
  <text class="muted tiny" x="955" y="500">No yanking focus</text>
  <text class="muted tiny" x="955" y="532">while deliberately</text>
  <text class="muted tiny" x="955" y="564">viewing history.</text>
  <text class="ok tiny" x="955" y="626">Esc returns latest</text>

  <!-- Footer rule block -->
  <rect class="panel" x="60" y="1490" width="1080" height="60" rx="18"/>
  <text class="ink small" x="85" y="1528">Contract: latest anchored · keyboard first · onscreen fallback · provider-safe actions · privacy redaction</text>
</svg>
