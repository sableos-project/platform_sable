<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Sable All Apps Titan 2 visual target</title>
  <desc id="desc">Keyboard-first All Apps visual reference for Titan 2. It shows app names, privacy summaries, search, filters, app actions and base-bar customization using Titan 2 hardware proportions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06121d"/><stop offset="1" stop-color="#0b2a40"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1824"/><stop offset="1" stop-color="#05090e"/></linearGradient>
    <style><![CDATA[
      .title{font:800 40px Inter,Arial,sans-serif;fill:#eef8ff}.sub{font:400 19px Inter,Arial,sans-serif;fill:#c6d8e8}.panel{fill:rgba(255,255,255,.05);stroke:#31516d;stroke-width:1.3}.h{font:800 19px Inter,Arial,sans-serif;fill:#fff}.s{font:400 13px Inter,Arial,sans-serif;fill:#c2d2e2}.xs{font:400 10.5px Inter,Arial,sans-serif;fill:#aebfd1}.phone{fill:#05070a;stroke:#222b35;stroke-width:6}.bezel{fill:#11151b;stroke:#384552;stroke-width:2}.screen{fill:url(#screen);stroke:#284259;stroke-width:1.5}.row{fill:rgba(255,255,255,.04);stroke:rgba(255,255,255,.10);stroke-width:1}.focus{fill:rgba(28,125,218,.36);stroke:#55b9ff;stroke-width:2.2}.search{fill:#1a2b3b;stroke:#36506a;stroke-width:1}.blue{fill:#1587ff}.green{fill:#21c063}.red{fill:#ff5168}.orange{fill:#f6a524}.purple{fill:#7964ff}.gray{fill:#738294}.yellow{fill:#ffd05a}.white{fill:#fff}.kbd{fill:#080a0d;stroke:#2b333d;stroke-width:1}.key{fill:#11161c;stroke:#3c4650;stroke-width:1}.table{fill:rgba(255,255,255,.09);stroke:#69c2ff;stroke-width:1}.th{fill:rgba(60,160,240,.24)}
    ]]></style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="30" y="50" class="title">Sable All Apps — Keyboard-First App Privacy UX</text>
  <text x="32" y="82" class="sub">Titan 2 visual target · app names first · privacy summaries under every app · type-to-jump · app actions · Start/base-bar customization</text>

  <!-- phone component macro manually repeated -->
  <g transform="translate(24 116)">
    <rect class="panel" width="296" height="628" rx="12"/><text x="16" y="28" class="h">1. All Apps</text>
    <g transform="translate(38 50)">
      <rect class="phone" width="220" height="520" rx="21"/><rect class="bezel" x="12" y="12" width="196" height="496" rx="13"/><rect class="screen" x="20" y="25" width="180" height="355" rx="8"/>
      <text x="31" y="47" class="xs">10:46</text><text x="155" y="47" class="xs">5G 99%</text><text x="31" y="76" class="h" style="font-size:15px">All Apps</text>
      <rect class="search" x="31" y="88" width="158" height="31" rx="9"/><text x="45" y="108" class="xs">⌕ Search apps...</text>
      <g transform="translate(31 131)">
        <rect class="focus" x="-4" y="-4" width="166" height="39" rx="8"/><circle class="orange" cx="14" cy="15" r="11"/><text x="32" y="13" class="s" style="font-weight:700">Calculator</text><text x="32" y="27" class="xs">No sensitive permissions</text><text x="150" y="21" class="s">›</text>
        <rect class="row" x="0" y="39" width="158" height="35" rx="7"/><circle class="blue" cx="14" cy="56" r="11"/><text x="32" y="54" class="s">Calendar</text><text x="32" y="68" class="xs">Calendar · Notifications</text><text x="150" y="61" class="s">›</text>
        <rect class="row" x="0" y="78" width="158" height="35" rx="7"/><circle class="gray" cx="14" cy="95" r="11"/><text x="32" y="93" class="s">Camera</text><text x="32" y="107" class="xs"><tspan class="yellow">Camera · Mic · Location</tspan></text><text x="150" y="100" class="s">›</text>
        <rect class="row" x="0" y="117" width="158" height="35" rx="7"/><circle class="blue" cx="14" cy="134" r="11"/><text x="32" y="132" class="s">Clock</text><text x="32" y="146" class="xs">No sensitive permissions</text><text x="150" y="139" class="s">›</text>
        <rect class="row" x="0" y="156" width="158" height="35" rx="7"/><circle class="green" cx="14" cy="173" r="11"/><text x="32" y="171" class="s">Contacts</text><text x="32" y="185" class="xs">Contacts · Notifications</text><text x="150" y="178" class="s">›</text>
        <rect class="row" x="0" y="195" width="158" height="35" rx="7"/><circle class="orange" cx="14" cy="212" r="11"/><text x="32" y="210" class="s">Files</text><text x="32" y="224" class="xs">Files · Media</text><text x="150" y="217" class="s">›</text>
      </g>
      <text x="28" y="364" class="xs">↑↓ Focus · Enter Open · Space Details</text>
      <g transform="translate(20 386)"><rect class="kbd" width="180" height="110" rx="4"/><g transform="translate(6 8)"><rect class="key" width="24" height="18" rx="2"/><rect class="key" x="31" width="42" height="18" rx="2"/><rect class="key" x="80" width="24" height="18" rx="2"/><rect class="key" x="111" width="24" height="18" rx="2"/><rect class="key" x="142" width="32" height="18" rx="2"/><g transform="translate(0 26)"><rect class="key" width="16" height="18" rx="2"/><rect class="key" x="20" width="16" height="18" rx="2"/><rect class="key" x="40" width="16" height="18" rx="2"/><rect class="key" x="60" width="16" height="18" rx="2"/><rect class="key" x="80" width="16" height="18" rx="2"/><rect class="key" x="100" width="16" height="18" rx="2"/><rect class="key" x="120" width="16" height="18" rx="2"/><rect class="key" x="140" width="16" height="18" rx="2"/><rect class="key" x="160" width="16" height="18" rx="2"/></g><g transform="translate(8 50)"><rect class="key" width="18" height="18" rx="2"/><rect class="key" x="23" width="18" height="18" rx="2"/><rect class="key" x="46" width="18" height="18" rx="2"/><rect class="key" x="69" width="18" height="18" rx="2"/><rect class="key" x="92" width="18" height="18" rx="2"/><rect class="key" x="115" width="18" height="18" rx="2"/><rect class="key" x="138" width="28" height="18" rx="2"/></g><g transform="translate(4 74)"><rect class="key" width="19" height="18" rx="2"/><rect class="key" x="24" width="19" height="18" rx="2"/><rect class="key" x="48" width="19" height="18" rx="2"/><rect class="key" x="72" width="48" height="18" rx="2"/><rect class="key" x="126" width="19" height="18" rx="2"/><rect class="key" x="150" width="26" height="18" rx="2"/></g></g></g>
    </g><text x="18" y="602" class="s">Default list shows app names and privacy summaries, not package names.</text>
  </g>

  <g transform="translate(336 116)">
    <rect class="panel" width="296" height="628" rx="12"/><text x="16" y="28" class="h">2. Search + Type</text>
    <g transform="translate(38 50)"><rect class="phone" width="220" height="520" rx="21"/><rect class="bezel" x="12" y="12" width="196" height="496" rx="13"/><rect class="screen" x="20" y="25" width="180" height="355" rx="8"/><text x="31" y="47" class="xs">10:46</text><text x="31" y="76" class="h" style="font-size:15px">All Apps</text><rect class="search" x="31" y="88" width="158" height="31" rx="9"/><text x="45" y="108" class="xs">⌕ cam</text><text x="175" y="108" class="xs">×</text><text x="31" y="136" class="xs">Apps</text><rect class="focus" x="27" y="148" width="166" height="39" rx="8"/><circle class="gray" cx="45" cy="168" r="11"/><text x="63" y="166" class="s" style="font-weight:700">Camera</text><text x="63" y="180" class="xs"><tspan class="yellow">Camera · Mic · Location</tspan></text><rect class="row" x="31" y="195" width="158" height="35" rx="7"/><circle class="blue" cx="45" cy="212" r="11"/><text x="63" y="210" class="s">Calendar</text><text x="63" y="224" class="xs">Calendar · Notifications</text><text x="31" y="251" class="xs">Permission matches</text><rect class="row" x="31" y="263" width="158" height="35" rx="7"/><circle class="green" cx="45" cy="280" r="11"/><text x="63" y="278" class="s">Maps</text><text x="63" y="292" class="xs"><tspan class="yellow">Location</tspan></text><text x="31" y="332" class="xs">Type C→Camera · / full search</text><g transform="translate(20 386)"><rect class="kbd" width="180" height="110" rx="4"/><text x="44" y="58" class="xs">Titan 2 keyboard</text></g></g><text x="18" y="602" class="s">Search matches app names, aliases, and privacy groups like camera/mic/location.</text>
  </g>

  <g transform="translate(648 116)">
    <rect class="panel" width="296" height="628" rx="12"/><text x="16" y="28" class="h">3. Privacy Filters</text>
    <g transform="translate(38 50)"><rect class="phone" width="220" height="520" rx="21"/><rect class="bezel" x="12" y="12" width="196" height="496" rx="13"/><rect class="screen" x="20" y="25" width="180" height="355" rx="8"/><text x="31" y="47" class="xs">10:46</text><text x="31" y="76" class="h" style="font-size:15px">All Apps</text><rect class="search" x="31" y="88" width="158" height="31" rx="9"/><text x="45" y="108" class="xs">⌕ Search apps...</text><g transform="translate(31 130)"><rect class="focus" width="72" height="24" rx="7"/><text x="12" y="16" class="xs" fill="#fff">Sensitive</text><rect class="row" x="78" width="44" height="24" rx="7"/><text x="88" y="16" class="xs">All</text><rect class="row" x="128" width="30" height="24" rx="7"/><text x="137" y="16" class="xs">No</text></g><g transform="translate(31 168)"><rect class="row" width="158" height="42" rx="7"/><circle class="gray" cx="14" cy="21" r="11"/><text x="32" y="18" class="s">Camera</text><text x="32" y="32" class="xs"><tspan class="yellow">Camera · Mic · Location</tspan></text><rect class="focus" x="-4" y="48" width="166" height="46" rx="8"/><circle class="blue" cx="14" cy="71" r="11"/><text x="32" y="68" class="s" style="font-weight:700">Browser</text><text x="32" y="82" class="xs"><tspan class="yellow">Camera · Mic · Location</tspan></text><rect class="row" y="100" width="158" height="42" rx="7"/><circle class="green" cx="14" cy="121" r="11"/><text x="32" y="118" class="s">Maps</text><text x="32" y="132" class="xs"><tspan class="yellow">Location · Network</tspan></text></g><text x="31" y="332" class="xs">←→ filters · Enter applies</text><g transform="translate(20 386)"><rect class="kbd" width="180" height="110" rx="4"/><text x="44" y="58" class="xs">Titan 2 keyboard</text></g></g><text x="18" y="602" class="s">Filters surface risk-sensitive apps without turning the default list into an audit tool.</text>
  </g>

  <g transform="translate(960 116)">
    <rect class="panel" width="296" height="628" rx="12"/><text x="16" y="28" class="h">4. App Actions</text>
    <g transform="translate(38 50)"><rect class="phone" width="220" height="520" rx="21"/><rect class="bezel" x="12" y="12" width="196" height="496" rx="13"/><rect class="screen" x="20" y="25" width="180" height="355" rx="8"/><text x="31" y="47" class="xs">10:46</text><text x="31" y="76" class="h" style="font-size:15px">Camera</text><text x="31" y="96" class="xs">Camera app</text><rect class="row" x="31" y="117" width="158" height="210" rx="9"/><g transform="translate(45 132)"><rect class="focus" width="126" height="28" rx="7"/><text x="25" y="18" class="s" style="font-weight:700">Open</text><text x="0" y="53" class="s">ⓘ App info</text><text x="0" y="83" class="s">⚿ Permissions</text><text x="0" y="113" class="s">★ Pin to Start</text><text x="0" y="143" class="s">▣ Add to base bar</text><text x="0" y="173" class="s" fill="#ff7080">🗑 Uninstall</text></g><text x="31" y="349" class="xs">Menu / long press / Fn+Enter</text><g transform="translate(20 386)"><rect class="kbd" width="180" height="110" rx="4"/><text x="44" y="58" class="xs">Titan 2 keyboard</text></g></g><text x="18" y="602" class="s">App actions are keyboard-accessible; uninstall/disable require confirmation.</text>
  </g>

  <g transform="translate(1272 116)">
    <rect class="panel" width="296" height="628" rx="12"/><text x="16" y="28" class="h">5. Base Bar Add</text>
    <g transform="translate(38 50)"><rect class="phone" width="220" height="520" rx="21"/><rect class="bezel" x="12" y="12" width="196" height="496" rx="13"/><rect class="screen" x="20" y="25" width="180" height="355" rx="8"/><text x="31" y="47" class="xs">10:46</text><text x="31" y="76" class="h" style="font-size:15px">Choose base bar slot</text><text x="31" y="98" class="xs">Add Browser to quick bar</text><g transform="translate(31 124)"><rect class="row" width="158" height="44" rx="8"/><circle class="green" cx="17" cy="22" r="13"/><text x="39" y="20" class="s">Phone</text><text x="39" y="34" class="xs">Keep</text><rect class="focus" x="-4" y="54" width="166" height="48" rx="8"/><circle class="blue" cx="17" cy="78" r="13"/><text x="39" y="76" class="s" style="font-weight:700">Hub</text><text x="39" y="90" class="xs">Replace with Browser</text><rect class="row" y="112" width="158" height="44" rx="8"/><circle class="gray" cx="17" cy="134" r="13"/><text x="39" y="132" class="s">Command</text><text x="39" y="146" class="xs">Required path</text><rect class="row" y="166" width="158" height="44" rx="8"/><circle class="orange" cx="17" cy="188" r="13"/><text x="39" y="186" class="s">All Apps</text><text x="39" y="200" class="xs">Required path</text></g><text x="31" y="349" class="xs">Hub still reachable by right page</text><g transform="translate(20 386)"><rect class="kbd" width="180" height="110" rx="4"/><text x="44" y="58" class="xs">Titan 2 keyboard</text></g></g><text x="18" y="602" class="s">All Apps can add apps to Start/base bar while preserving required fallback paths.</text>
  </g>

  <g transform="translate(24 770)">
    <rect class="table" width="384" height="190" rx="10"/><rect class="th" width="384" height="34" rx="10"/><text x="18" y="23" class="h" style="font-size:16px">Keyboard Shortcuts</text><text x="18" y="62" class="s">↑ / ↓</text><text x="130" y="62" class="s">Move app focus</text><text x="18" y="90" class="s">Enter</text><text x="130" y="90" class="s">Open app</text><text x="18" y="118" class="s">Space</text><text x="130" y="118" class="s">Peek privacy summary</text><text x="18" y="146" class="s">Menu / Fn+Enter</text><text x="130" y="146" class="s">App actions</text><text x="18" y="174" class="s">/</text><text x="130" y="174" class="s">Search apps</text>
  </g>
  <g transform="translate(424 770)">
    <rect class="table" width="384" height="190" rx="10"/><rect class="th" width="384" height="34" rx="10"/><text x="18" y="23" class="h" style="font-size:16px">Privacy Summary</text><text x="18" y="62" class="s">No sensitive permissions</text><text x="190" y="62" class="s">Shown explicitly</text><text x="18" y="90" class="s">Camera · Mic · Location</text><text x="190" y="90" class="s">Highlighted</text><text x="18" y="118" class="s">Package names</text><text x="190" y="118" class="s">Hidden by default</text><text x="18" y="146" class="s">Recent access</text><text x="190" y="146" class="s">Only with runtime evidence</text>
  </g>
  <g transform="translate(824 770)">
    <rect class="table" width="384" height="190" rx="10"/><rect class="th" width="384" height="34" rx="10"/><text x="18" y="23" class="h" style="font-size:16px">Pointer Interaction</text><text x="18" y="62" class="s">Hover</text><text x="130" y="62" class="s">Highlight only</text><text x="18" y="90" class="s">Click</text><text x="130" y="90" class="s">Focus/open row</text><text x="18" y="118" class="s">Right click</text><text x="130" y="118" class="s">Actions menu</text><text x="18" y="146" class="s">Scroll</text><text x="130" y="146" class="s">List scroll</text>
  </g>
  <g transform="translate(1224 770)">
    <rect class="table" width="352" height="190" rx="10"/><rect class="th" width="352" height="34" rx="10"/><text x="18" y="23" class="h" style="font-size:16px">Validation</text><text x="18" y="62" class="s">Titan 2 hardware template</text><text x="18" y="90" class="s">Square display + physical keyboard</text><text x="18" y="118" class="s">App names first</text><text x="18" y="146" class="s">Privacy summaries visible</text><text x="18" y="174" class="s">No slab-phone target</text>
  </g>
</svg>
