<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Sable Setup Wizard / First Boot Titan 2 visual target</title>
  <desc id="desc">Keyboard-first Setup Wizard visual design using Titan 2 square display and physical keyboard proportions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061018"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222936"/>
      <stop offset="1" stop-color="#0b111a"/>
    </linearGradient>
    <style>
      .title{font:700 34px system-ui,-apple-system,Segoe UI,sans-serif;fill:#f8fbff}
      .subtitle{font:500 16px system-ui,-apple-system,Segoe UI,sans-serif;fill:#9fb3c8}
      .panelTitle{font:700 20px system-ui,-apple-system,Segoe UI,sans-serif;fill:#eef6ff}
      .phoneText{font:600 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#e8f3ff}
      .small{font:500 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#aebed0}
      .tiny{font:500 10px system-ui,-apple-system,Segoe UI,sans-serif;fill:#9aabbf}
      .accent{fill:#2fd0ff}
      .focus{fill:none;stroke:#2fd0ff;stroke-width:3}
      .line{stroke:#2b3a4c;stroke-width:1}
      .card{fill:#121b28;stroke:#26384e;stroke-width:1.3}
      .chip{fill:#162638;stroke:#2b5b78;stroke-width:1}
      .key{fill:#18212e;stroke:#38495c;stroke-width:1}
      .keyText{font:700 9px system-ui,-apple-system,Segoe UI,sans-serif;fill:#d8e7f5;text-anchor:middle}
      .body{font:500 13px system-ui,-apple-system,Segoe UI,sans-serif;fill:#c4d4e6}
      .green{fill:#72e08a}
      .warn{fill:#ffd166}
      .red{fill:#ff6b6b}
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <text x="60" y="58" class="title">Sable Setup Wizard / First Boot — Titan 2 Visual Target</text>
  <text x="60" y="88" class="subtitle">Safe onboarding: keyboard verification, Wi‑Fi password entry, privacy posture, theme choice, restore/import gates, and ready-to-start guidance.</text>

  <g transform="translate(60,125)">
    <text x="0" y="0" class="panelTitle">1 · Welcome + keyboard verification</text>
    <rect x="0" y="22" width="405" height="690" rx="36" fill="url(#phone)" stroke="#40546b" stroke-width="3"/>
    <rect x="34" y="54" width="337" height="337" rx="20" fill="#07101a" stroke="#35485d" stroke-width="2"/>
    <text x="58" y="83" class="tiny">10:46</text><text x="315" y="83" class="tiny">99%</text>
    <text x="58" y="118" class="phoneText">Welcome to SableOS</text>
    <text x="58" y="145" class="small">Titan 2 first boot</text>
    <rect x="58" y="171" width="288" height="38" rx="10" class="chip"/>
    <text x="72" y="195" class="small">Language · Accessibility · Emergency</text>
    <rect x="58" y="225" width="288" height="62" rx="14" class="card"/>
    <rect x="62" y="229" width="280" height="54" rx="12" class="focus"/>
    <text x="78" y="250" class="phoneText">Check physical keyboard</text>
    <text x="78" y="273" class="small">Type A 7 @ then press Enter</text>
    <rect x="58" y="301" width="137" height="38" rx="10" fill="#143044"/>
    <text x="84" y="325" class="small">Start</text>
    <rect x="209" y="301" width="137" height="38" rx="10" class="card"/>
    <text x="232" y="325" class="small">Software keyboard</text>
    <text x="58" y="367" class="tiny">Tab/arrows focus · Enter select · Back previous</text>

    <g transform="translate(34,415)">
      <rect width="337" height="240" rx="20" fill="#101823" stroke="#35485d" stroke-width="2"/>
      <text x="168" y="26" class="tiny" text-anchor="middle">physical Titan 2 keyboard</text>
      <g transform="translate(18,48)">
        <rect x="0" y="0" width="48" height="20" rx="5" class="key"/><text x="24" y="14" class="keyText">Home</text>
        <rect x="58" y="0" width="48" height="20" rx="5" class="key"/><text x="82" y="14" class="keyText">Sym</text>
        <rect x="116" y="0" width="48" height="20" rx="5" class="key"/><text x="140" y="14" class="keyText">Back</text>
        <rect x="174" y="0" width="48" height="20" rx="5" class="key"/><text x="198" y="14" class="keyText">Fn</text>
        <rect x="232" y="0" width="48" height="20" rx="5" class="key"/><text x="256" y="14" class="keyText">Alt</text>
      </g>
      <g transform="translate(22,86)">
        <rect x="0" y="0" width="26" height="22" rx="5" class="key"/><text x="13" y="15" class="keyText">Q</text><rect x="31" y="0" width="26" height="22" rx="5" class="key"/><text x="44" y="15" class="keyText">W</text><rect x="62" y="0" width="26" height="22" rx="5" class="key"/><text x="75" y="15" class="keyText">E</text><rect x="93" y="0" width="26" height="22" rx="5" class="key"/><text x="106" y="15" class="keyText">R</text><rect x="124" y="0" width="26" height="22" rx="5" class="key"/><text x="137" y="15" class="keyText">T</text><rect x="155" y="0" width="26" height="22" rx="5" class="key"/><text x="168" y="15" class="keyText">Y</text><rect x="186" y="0" width="26" height="22" rx="5" class="key"/><text x="199" y="15" class="keyText">U</text><rect x="217" y="0" width="26" height="22" rx="5" class="key"/><text x="230" y="15" class="keyText">I</text><rect x="248" y="0" width="26" height="22" rx="5" class="key"/><text x="261" y="15" class="keyText">O</text><rect x="279" y="0" width="26" height="22" rx="5" class="key"/><text x="292" y="15" class="keyText">P</text>
        <rect x="16" y="34" width="26" height="22" rx="5" class="key"/><text x="29" y="49" class="keyText">A</text><rect x="47" y="34" width="26" height="22" rx="5" class="key"/><text x="60" y="49" class="keyText">S</text><rect x="78" y="34" width="26" height="22" rx="5" class="key"/><text x="91" y="49" class="keyText">D</text><rect x="109" y="34" width="26" height="22" rx="5" class="key"/><text x="122" y="49" class="keyText">F</text><rect x="140" y="34" width="26" height="22" rx="5" class="key"/><text x="153" y="49" class="keyText">G</text><rect x="171" y="34" width="26" height="22" rx="5" class="key"/><text x="184" y="49" class="keyText">H</text><rect x="202" y="34" width="26" height="22" rx="5" class="key"/><text x="215" y="49" class="keyText">J</text><rect x="233" y="34" width="26" height="22" rx="5" class="key"/><text x="246" y="49" class="keyText">K</text><rect x="264" y="34" width="26" height="22" rx="5" class="key"/><text x="277" y="49" class="keyText">L</text>
        <rect x="36" y="68" width="26" height="22" rx="5" class="key"/><text x="49" y="83" class="keyText">Z</text><rect x="67" y="68" width="26" height="22" rx="5" class="key"/><text x="80" y="83" class="keyText">X</text><rect x="98" y="68" width="26" height="22" rx="5" class="key"/><text x="111" y="83" class="keyText">C</text><rect x="129" y="68" width="26" height="22" rx="5" class="key"/><text x="142" y="83" class="keyText">V</text><rect x="160" y="68" width="54" height="22" rx="5" class="key"/><text x="187" y="83" class="keyText">Space</text><rect x="219" y="68" width="26" height="22" rx="5" class="key"/><text x="232" y="83" class="keyText">N</text><rect x="250" y="68" width="26" height="22" rx="5" class="key"/><text x="263" y="83" class="keyText">M</text>
      </g>
    </g>
  </g>

  <g transform="translate(518,125)">
    <text x="0" y="0" class="panelTitle">2 · Wi‑Fi + privacy + theme</text>
    <rect x="0" y="22" width="405" height="690" rx="36" fill="url(#phone)" stroke="#40546b" stroke-width="3"/>
    <rect x="34" y="54" width="337" height="337" rx="20" fill="#07101a" stroke="#35485d" stroke-width="2"/>
    <text x="58" y="83" class="tiny">First boot · step 3 of 8</text>
    <text x="58" y="118" class="phoneText">Connect to Wi‑Fi</text>
    <rect x="58" y="142" width="288" height="44" rx="12" class="card"/>
    <text x="76" y="170" class="small">SableHome_5G</text>
    <rect x="58" y="198" width="288" height="58" rx="14" class="card"/>
    <rect x="62" y="202" width="280" height="50" rx="12" class="focus"/>
    <text x="76" y="222" class="small">Password</text>
    <text x="76" y="244" class="phoneText">••••••••••</text>
    <rect x="58" y="270" width="88" height="34" rx="10" fill="#143044"/>
    <text x="83" y="292" class="small">Join</text>
    <rect x="158" y="270" width="88" height="34" rx="10" class="card"/>
    <text x="176" y="292" class="small">Show</text>
    <rect x="258" y="270" width="88" height="34" rx="10" class="card"/>
    <text x="276" y="292" class="small">Skip</text>
    <text x="58" y="331" class="tiny">Alt/Sym/Fn required · software keyboard fallback</text>
    <text x="58" y="363" class="tiny">Privacy posture and theme are next</text>

    <g transform="translate(34,415)">
      <rect width="337" height="240" rx="20" fill="#101823" stroke="#35485d" stroke-width="2"/>
      <text x="24" y="36" class="phoneText">Privacy + appearance</text>
      <rect x="24" y="56" width="289" height="40" rx="10" class="chip"/>
      <text x="42" y="81" class="small">Local-first posture · providers keep accounts</text>
      <rect x="24" y="110" width="137" height="42" rx="12" fill="#143044"/>
      <text x="57" y="136" class="small">Dark</text>
      <rect x="176" y="110" width="137" height="42" rx="12" class="card"/>
      <text x="213" y="136" class="small">Light</text>
      <rect x="24" y="168" width="289" height="38" rx="10" class="card"/>
      <text x="42" y="192" class="small">Restore/import: fail-closed until validated</text>
    </g>
  </g>

  <g transform="translate(976,125)">
    <text x="0" y="0" class="panelTitle">3 · Ready to Start</text>
    <rect x="0" y="22" width="405" height="690" rx="36" fill="url(#phone)" stroke="#40546b" stroke-width="3"/>
    <rect x="34" y="54" width="337" height="337" rx="20" fill="#07101a" stroke="#35485d" stroke-width="2"/>
    <text x="58" y="83" class="tiny">Setup complete</text>
    <text x="58" y="118" class="phoneText">Ready for Sable Start</text>
    <rect x="58" y="146" width="288" height="46" rx="12" class="chip"/>
    <text x="76" y="175" class="small">Home opens Start · type to search</text>
    <rect x="58" y="207" width="288" height="46" rx="12" class="card"/>
    <text x="76" y="236" class="small">Left: Glance · Right: Hub</text>
    <rect x="58" y="268" width="288" height="46" rx="12" class="card"/>
    <text x="76" y="297" class="small">Command, All Apps, Settings available</text>
    <rect x="58" y="332" width="288" height="42" rx="12" fill="#143044"/>
    <text x="146" y="358" class="small">Start</text>

    <g transform="translate(34,415)">
      <rect width="337" height="240" rx="20" fill="#101823" stroke="#35485d" stroke-width="2"/>
      <text x="24" y="33" class="phoneText">Validation gates</text>
      <text x="24" y="62" class="small"><tspan class="green">●</tspan> Keyboard verification</text>
      <text x="24" y="91" class="small"><tspan class="green">●</tspan> Wi‑Fi password entry</text>
      <text x="24" y="120" class="small"><tspan class="green">●</tspan> Alt / Sym / Fn text entry</text>
      <text x="24" y="149" class="small"><tspan class="green">●</tspan> Software keyboard fallback</text>
      <text x="24" y="178" class="small"><tspan class="green">●</tspan> Privacy posture explicit</text>
      <text x="24" y="207" class="small"><tspan class="warn">●</tspan> Restore/import fail-closed</text>
    </g>
  </g>

  <g transform="translate(60,840)">
    <text class="subtitle" x="0" y="0">Interactions: Tab/↑↓ focus · Enter activate · Back previous · typing enters focused fields · Alt/Sym/Fn required · software keyboard fallback visible · touch secondary.</text>
    <text class="subtitle" x="0" y="28">Validation: TITAN2_HARDWARE_TEMPLATE=PASS · CRITICAL_TEXT_ENTRY_GATE=PASS · PRIVACY_POSTURE_EXPLICIT=PASS · RESTORE_IMPORT_FAIL_CLOSED=PASS.</text>
  </g>
</svg>
