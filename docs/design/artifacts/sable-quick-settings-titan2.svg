<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950" role="img" aria-labelledby="title desc">
  <title id="title">Sable Quick Settings and Notification Shade Titan 2 visual target</title>
  <desc id="desc">Keyboard-first visual target for Quick Settings and Notification Shade on Titan 2 with square display and physical keyboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07121d"/>
      <stop offset="1" stop-color="#0c2537"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101c29"/>
      <stop offset="1" stop-color="#05090f"/>
    </linearGradient>
    <style>
      .title { font: 800 40px system-ui, -apple-system, Segoe UI, sans-serif; fill: #f4f9ff; }
      .subtitle { font: 400 19px system-ui, -apple-system, Segoe UI, sans-serif; fill: #bfd0e2; }
      .section { font: 750 22px system-ui, -apple-system, Segoe UI, sans-serif; fill: #f4f9ff; }
      .label { font: 650 14px system-ui, -apple-system, Segoe UI, sans-serif; fill: #f2f8ff; }
      .small { font: 400 12px system-ui, -apple-system, Segoe UI, sans-serif; fill: #b9c9dc; }
      .tiny { font: 400 10.5px system-ui, -apple-system, Segoe UI, sans-serif; fill: #aab9cb; }
      .panel { fill: rgba(255,255,255,0.045); stroke: rgba(255,255,255,0.16); stroke-width: 1.4; }
      .phone { fill: #05070a; stroke: #242c35; stroke-width: 6; }
      .bezel { fill: #111820; stroke: #354553; stroke-width: 2; }
      .screen { fill: url(#screen); stroke: #2b4054; stroke-width: 1.5; }
      .keyboard { fill: #090d12; stroke: #25313e; stroke-width: 1.5; }
      .key { fill: #161e27; stroke: #354557; stroke-width: 0.8; }
      .row { fill: rgba(255,255,255,0.055); stroke: rgba(255,255,255,0.09); stroke-width: 1; }
      .tile { fill: #14283a; stroke: #2d4861; stroke-width: 1; }
      .tileOn { fill: #0c6fbf; stroke: #65bdff; stroke-width: 1.2; }
      .focus { fill: rgba(35,130,230,0.28); stroke: #5dbcff; stroke-width: 2.2; }
      .warn { fill: #ffd25a; }
      .green { fill: #25c46f; }
      .blue { fill: #1588ff; }
      .orange { fill: #f5a531; }
      .red { fill: #ff566d; }
      .purple { fill: #806bff; }
      .muted { fill: #69798b; }
    </style>
  </defs>

