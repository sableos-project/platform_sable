        <rect class="key" x="30" y="0" width="24" height="17" rx="4"/><text x="35" y="12" class="tiny">↓</text>
        <rect class="key" x="60" y="0" width="24" height="17" rx="4"/><text x="66" y="12" class="tiny">↵</text>
