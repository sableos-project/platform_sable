        <rect class="key" x="30" y="0" width="24" height="17" rx="4"/><text x="36" y="12" class="tiny">Sp</text>
        <rect class="key" x="60" y="0" width="24" height="17" rx="4"/><text x="66" y="12" class="tiny">M</text>
        <rect class="key" x="90" y="0" width="24" height="17" rx="4"/><text x="96" y="12" class="tiny">/</text>
        <rect class="key" x="120" y="0" width="24" height="17" rx="4"/><text x="126" y="12" class="tiny">Bk</text>
