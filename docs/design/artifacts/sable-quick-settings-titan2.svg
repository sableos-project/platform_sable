      <rect class="focus" x="36" y="117" width="198" height="42" rx="10"/>
      <circle class="green" cx="55" cy="138" r="10"/><text x="72" y="134" class="tiny">Messages</text><text x="72" y="147" class="tiny">2 new · content hidden</text>
